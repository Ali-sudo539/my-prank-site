<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код Будущего</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #1e5eff, transparent 45%),
                linear-gradient(135deg, #06152f, #0b2d68);
            color: white;
        }
        .card {
            width: 90%;
            max-width: 420px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
            animation: appear 0.7s ease;
        }
        h1 {
            margin-top: 0;
            font-size: 34px;
            color: white;
        }
        .description {
            color: #d9e7ff;
            margin-bottom: 35px;
            font-size: 16px;
        }
        .sound-button {
            width: 160px;
            height: 160px;
            border: 5px solid white;
            border-radius: 50%;
            font-size: 65px;
            cursor: pointer;
            background: linear-gradient(
                145deg,
                #1473ff,
                #0044c7
            );
            box-shadow:
                0 0 30px rgba(20, 115, 255, 0.6),
                0 15px 40px rgba(0, 0, 0, 0.4);
            transition: 0.2s;
        }
        .sound-button:hover {
            transform: scale(1.07);
        }
        .sound-button:active {
            transform: scale(0.92);
        }
        .info {
            margin-top: 30px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            color: #e8f1ff;
            font-size: 14px;
        }
        .green {
            color: #20e070;
            font-weight: bold;
        }
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Код Будущего</h1>
        <p class="description">
            Нажми на кнопку чтобы услышать код для регистрации
        </p>
        <button class="sound-button" onclick="playSound()">
            ▶️
        </button>
        <div class="info">
            не сообщайте код ни кому!!!<br><br>
            <span class="green">✓ Готово!</span>
        </div>
    </div>
    <audio id="sound" src="fart.mp3"></audio>
    <script>
        const sound = document.getElementById("sound");
        function playSound() {
            sound.currentTime = 0;
            sound.play();
        }
    </script>
</body>
</html>
