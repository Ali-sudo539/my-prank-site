<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Код Будущего</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            color: #172b4d;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(31, 61, 104, 0.12);
        }
        h1 {
            text-align: center;
            margin-top: 0;
        }
        .demo {
            text-align: center;
            color: #60728a;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #ccd8e6;
            border-radius: 9px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1769e0;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Регистрация</h1>
    <p class="demo">
        Демонстрационная страница.<br>
        Данные не отправляются и не сохраняются.
    </p>
    <form onsubmit="demoRegister(event)">
        <input
            type="text"
            placeholder="Имя"
            autocomplete="off"
            required>
        <input
            type="text"
            placeholder="Логин"
            autocomplete="off"
            required>
        <input
            type="password"
            placeholder="Пароль"
            autocomplete="off"
            required>
        <button type="submit">
            Зарегистрироваться
        </button>
    </form>
    <a class="back" href="index.html">
        ← Вернуться назад
    </a>
</div>
<script>
function demoRegister(event) {
    event.preventDefault();
    alert("Это демонстрация. Данные никуда не отправляются.");
    event.target.reset();
}
</script>
</body>
</html>
